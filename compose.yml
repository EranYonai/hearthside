# Production stack. Build and run on the host with:
#   docker compose up -d --build
# The web app listens on the host's loopback only; the tunnel on the host
# forwards to it. Nothing is reachable from the LAN.
name: hearthside

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: hearthside
      POSTGRES_USER: hearthside
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hearthside -d hearthside']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    logging: *logging

  web:
    build:
      context: .
      target: web
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: hearthside-web
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://hearthside@db:5432/hearthside
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      # The exact address you open the app at. Passkeys are bound to it.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3300}
      # The local categorization model. If it is down, entries wait for it.
      DECIDE_URL: http://decide:8080
    secrets: [db_password]
    ports:
      # Loopback only by default. WEB_BIND=0.0.0.0 in .env opens it to the LAN for testing.
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3300}:3000
    depends_on:
      db:
        condition: service_healthy
    networks: [data, app, model]
    logging: *logging

  # One-shot: downloads the model files (about 1.7 GB) into the `models` volume the first
  # time, then exits. It sends no household data; it only fetches published model files.
  decide-fetch:
    build:
      context: .
      target: decide
    image: hearthside-decide
    command: ['node', 'src/fetch-model.ts']
    restart: 'no'
    # The image's health check is for the service, not this one-shot download.
    healthcheck:
      disable: true
    <<: *hardening
    environment:
      LAYA_VARIANT: ${LAYA_VARIANT:-}
    volumes:
      - models:/models
    networks: [fetch]
    logging: *logging

  # The local model. Reachable only by the web app, with no database and no internet.
  decide:
    image: hearthside-decide
    restart: unless-stopped
    <<: *hardening
    environment:
      MODEL_THREADS: ${MODEL_THREADS:-2}
    volumes:
      - models:/models:ro
    depends_on:
      decide-fetch:
        condition: service_completed_successfully
    # The model takes about 2 GB loaded.
    mem_limit: ${MODEL_MEMORY:-3g}
    networks: [model]
    logging: *logging

  worker:
    build:
      context: .
      target: worker
    image: hearthside-worker
    restart: unless-stopped
    <<: *hardening
    environment:
      WEB_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy
    # The worker is on the app network only: it reaches the web API, never the database.
    networks: [app]
    logging: *logging

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
  models:

networks:
  data:
    internal: true
  app:
  # Web app <-> model only. Internal: no way out to the internet.
  model:
    internal: true
  # Only for downloading the model files.
  fetch:
