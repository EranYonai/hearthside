name: Release

# Bump the version with `pnpm release patch|minor|major` in a PR. When it lands on main,
# this tags v<version> and publishes a GitHub release with generated notes.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag and release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
